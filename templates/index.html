<html>
<head>
<title>Banking Transaction System</title>
<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px lightgray;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#1565c0;
color:white;
}
</style>
</head>

<body>

<div class="card">
<h1>🏦 Banking Transaction System v2.0</h1>
</div>

<div class="card">
<h2>Customer Accounts</h2>

<table>
<tr>
<th>Account Number</th>
<th>Customer</th>
<th>Balance</th>
</tr>

{% for acc_no, acc in accounts.items() %}
<tr>
<td>{{ acc_no }}</td>
<td>{{ acc.name }}</td>
<td>₹ {{ acc.balance }}</td>
</tr>
{% endfor %}

</table>
</div>

</body>
</html>
