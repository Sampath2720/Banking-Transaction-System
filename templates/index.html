<html>
<head>
<title>Banking Transaction System</title>
</head>
<body>

<h1>🏦 Banking Transaction System v2.0</h1>

<h2>Customer Accounts</h2>

<table border="1">
<tr>
<th>Account Number</th>
<th>Customer Name</th>
<th>Balance</th>
</tr>

{% for acc_no, acc in accounts.items() %}
<tr>
<td>{{ acc_no }}</td>
<td>{{ acc.name }}</td>
<td>{{ acc.balance }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
